# ---------------------------------------------------------------------------
# Default datasource: DuckDB (embedded, file-based, zero external setup).
#
# Quarkus has no built-in db-kind for DuckDB, so db-kind is set to "other" and
# the JDBC driver is wired manually (org.duckdb:duckdb_jdbc is on the
# classpath, see pom.xml). Since db-kind=other, Hibernate can't auto-detect a
# dialect either -- but DuckDB's SQL dialect tracks PostgreSQL closely enough
# that Hibernate's stock PostgreSQLDialect works against it directly. The
# only wrinkle is DuckDbDialect (in this module), a one-method subclass that
# disables a Postgres-only NOTICE-suppression statement DuckDB doesn't know.
# The Postgres server-version check is disabled since DuckDB reports its own
# version ("1.0.0"), not a Postgres version, which would otherwise fail the
# ">= 13.0" check the dialect performs.
# ---------------------------------------------------------------------------
quarkus.datasource.db-kind=other
quarkus.datasource.jdbc.driver=org.duckdb.DuckDBDriver
quarkus.datasource.jdbc.url=jdbc:duckdb:${user.dir}/data/ai-costing.duckdb
quarkus.hibernate-orm.dialect=com.aicosting.DuckDbDialect
quarkus.hibernate-orm.database.version-check.enabled=false
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql

# Rate card used by CostingService (PKR/hour), mirrors the Streamlit app defaults.
aicosting.rate.machine-1=5000
aicosting.rate.machine-2=3500

# ---------------------------------------------------------------------------
# PostgreSQL profile -- proves the same entities/repositories/JPQL work
# unchanged against Postgres. Activate with:
#   mvn quarkus:dev -Dquarkus.profile=postgres
# against a running Postgres instance, e.g.:
#   docker run --rm -e POSTGRES_USER=quarkus -e POSTGRES_PASSWORD=quarkus \
#     -e POSTGRES_DB=ai_costing -p 5432:5432 postgres:16
# ---------------------------------------------------------------------------
%postgres.quarkus.datasource.db-kind=postgresql
# The default profile pins jdbc.driver to DuckDB's driver class; that value
# isn't overridden by db-kind alone, so it must be reset explicitly here or
# Agroal tries to open a postgresql:// URL with DuckDBDriver and fails with
# "Driver does not support the provided URL".
%postgres.quarkus.datasource.jdbc.driver=org.postgresql.Driver
%postgres.quarkus.datasource.username=quarkus
%postgres.quarkus.datasource.password=quarkus
%postgres.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/ai_costing
%postgres.quarkus.hibernate-orm.dialect=org.hibernate.dialect.PostgreSQLDialect
%postgres.quarkus.hibernate-orm.database.version-check.enabled=true

# MCP server (Streamable HTTP + SSE) is exposed at /mcp by default (quarkus-mcp-server-http).
